<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Minar - Perfect Tower</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1446">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1446;--sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px))}
@media (prefers-color-scheme: dark){:root{--bg:#120d33}}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;-webkit-tap-highlight-color:transparent}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:calc(var(--sat) + 14px) 16px calc(var(--sab) + 16px);box-sizing:border-box;overflow-y:auto;font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;color:#fff}
#ui.off{display:none}#ui.pass{pointer-events:none}#ui.mid{justify-content:center}
#ui.dim,#ui.mid{background:radial-gradient(120% 70% at 50% 0%,#3b1f7a 0%,#1a0f45 55%,#0d0726 100%)}
#ui>*{width:100%;max-width:400px;flex:none}
h1{margin:6px 0 0;text-align:center;font-size:68px;line-height:1;letter-spacing:2px;background:linear-gradient(#fff6d6,#ffc94d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.sub{margin:0;text-align:center;font-size:20px;text-shadow:0 2px 6px rgba(0,0,0,.4)}
h2{margin:0;font-size:26px;flex:1;text-align:center}h3{margin:0 0 8px;font-size:16px;opacity:.8;font-weight:600}
.hd{display:flex;align-items:center;gap:8px}.sp{width:44px}
.ib{width:44px;height:44px;border:0;border-radius:14px;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer}
.bar{display:flex;align-items:center;gap:8px}.bar .ib:last-child{margin-left:auto}
.pill{padding:8px 14px;border-radius:999px;background:rgba(20,10,50,.55);border:1px solid rgba(255,255,255,.18);font-weight:700;font-size:16px;color:#ffe28a;display:flex;gap:6px;align-items:center;position:relative;overflow:hidden}
.lv{flex:1;min-width:80px;justify-content:center;color:#3a2200;background:rgba(255,255,255,.25)}.lv i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#ffd66b,#f0a020)}.lv b{position:relative;font-size:14px}
.co{width:16px;height:16px;border-radius:50%;background:radial-gradient(#fff2a8,#f0b020);display:inline-block}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:18px;padding:15px 12px;font:700 19px Fredoka,system-ui,sans-serif;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.3);text-shadow:0 2px 3px rgba(0,0,0,.3);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.3)}
.g{background:linear-gradient(#5df29a,#1fc766)}.p{background:linear-gradient(#a56bff,#6a35d8)}.o{background:linear-gradient(#ffb454,#e8820c)}.b{background:linear-gradient(#5db4ff,#2a7de0)}.s{background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.big{font-size:28px;padding:18px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tri .btn{font-size:16px;padding:14px 4px}
.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:14px;box-sizing:border-box}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;box-sizing:border-box;padding:14px;border-radius:16px;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.1);color:#fff;font:600 17px Fredoka,system-ui,sans-serif;text-align:left;cursor:pointer}
.row small{display:block;font-weight:500;font-size:13px;opacity:.75;margin-top:2px}.row.danger{color:#ff9a9a;background:rgba(255,90,90,.14)}
.chip{padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.16);font-size:13px;font-weight:700;white-space:nowrap;display:inline-flex;gap:4px;align-items:center}.chip.ok{background:#1fc766;color:#06301a}.chip.pr{background:rgba(255,210,77,.2);color:#ffe28a}
.sw{width:50px;height:28px;border-radius:99px;background:rgba(255,255,255,.22);position:relative;transition:.2s;flex:none}.sw:after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:#1fc766}.sw.on:after{left:25px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:18px;border:2px solid transparent;background:rgba(255,255,255,.1);color:#fff;font:700 15px Fredoka,system-ui,sans-serif;cursor:pointer}
.tile.sel,.row.sel{border-color:#ffd24d;background:rgba(255,210,77,.16)}
.pv{display:flex;gap:6px}.pv i{width:24px;height:38px;border-radius:5px}
.ln{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid rgba(255,255,255,.08);font-size:16px}.ln:last-child{border:0}.dn{color:#9cf0c0}
.mut{opacity:.7;font-size:14px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat div{background:rgba(255,255,255,.08);border-radius:14px;padding:10px;text-align:center;font-size:13px}.stat b{display:block;font-size:21px;color:#ffe28a}
.score{text-align:center;font-size:84px;font-weight:700;line-height:1;margin:2px 0;text-shadow:0 4px 10px rgba(0,0,0,.4)}
.badge{align-self:center;padding:6px 18px;border-radius:99px;background:linear-gradient(#ffe27a,#f0a020);color:#4a2a00;font-weight:700;font-size:16px;width:auto!important;animation:pop .5s}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.in{animation:in .35s both}@keyframes in{from{opacity:0;transform:translateY(14px)}}
.ft{position:fixed;left:0;right:0;bottom:calc(var(--sab) + 8px);text-align:center;font-size:13px;opacity:.85;width:auto!important;max-width:none!important;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.tap{position:fixed;left:0;right:0;bottom:90px;text-align:center;font:700 26px Fredoka,sans-serif;animation:pl 1s infinite alternate;width:auto!important;max-width:none!important;text-shadow:0 2px 6px rgba(0,0,0,.5)}@keyframes pl{to{transform:scale(1.12);opacity:.7}}
.tut{text-align:center}.tut p{margin:6px 0;font-size:17px}
#toast{position:fixed;top:calc(var(--sat) + 70px);left:50%;transform:translate(-50%,-20px);padding:10px 18px;border-radius:99px;background:rgba(20,10,50,.92);border:1px solid rgba(255,210,77,.5);color:#ffe28a;font:700 16px Fredoka,system-ui,sans-serif;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}#toast.show{opacity:1;transform:translate(-50%,0)}
.md{position:fixed;inset:0;background:rgba(5,2,25,.74);display:grid;place-items:center;z-index:5;max-width:none!important}.md .card{width:min(86vw,340px);background:#241552;text-align:center}.md p{margin:4px 0;font-size:16px;opacity:.9}.md .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
</style></head><body><canvas id="c"></canvas><div id="ui" class="off"></div><div id="toast"></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const W=360,H=640,BH=26,BASE=H-110,SF='Fredoka,"Trebuchet MS",system-ui,sans-serif';
let sc,ox,oy,T0=performance.now();
function fit(){const d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;sc=Math.min(c.width/W,c.height/H);ox=(c.width-W*sc)/2;oy=(c.height-H*sc)/2}
addEventListener('resize',fit);fit();
let best=0;try{best=+localStorage.getItem('stackBest')||0}catch(e){}
let mute=false;try{mute=localStorage.getItem('stackMute')==='1'}catch(e){}
let vib=true;try{vib=localStorage.getItem('stackVib')!=='0'}catch(e){}
const defD=()=>({v:2,coins:0,played:0,top:[],unlocked:[0],sel:0,gd:'',lt:0,streak:0,th:0,tu:[0],m:{d:'',done:[0,0,0]},tut:0,xp:0,ach:[],dc:'',s:{perf:0,maxc:0,gold:0,maxh:0}});
let D=defD();try{const o=JSON.parse(localStorage.getItem('stackData')||'{}');if(o&&typeof o==='object'){Object.assign(D,o);if(!(D.coins>=0))D.coins=0;if(!Array.isArray(D.top))D.top=[];if(!Array.isArray(D.unlocked)||!D.unlocked.includes(0))D.unlocked=[0];if(!Array.isArray(D.tu)||!D.tu.includes(0))D.tu=[0];if(!(D.sel>=0&&D.sel<10))D.sel=0;if(!(D.th>=0&&D.th<5))D.th=0;if(!D.m||!Array.isArray(D.m.done))D.m={d:'',done:[0,0,0]};if(!D.s)D.s={perf:0,maxc:0,gold:0,maxh:0};if(!(D.xp>=0))D.xp=0;if(!Array.isArray(D.ach))D.ach=[];D.v=2}}catch(e){D=defD()}
function sv(){D.lt=Math.max(D.lt||0,Date.now());try{localStorage.setItem('stackData',JSON.stringify(D))}catch(e){}}
const SK=[{n:'Lahore Brick',c:0,s:62,l:50,h:y=>12+Math.sin(y/3)*7},{n:'Taj Marble',c:40,s:14,l:84,h:y=>40+Math.sin(y/4)*30},{n:'Multan Blue',c:80,s:78,l:48,h:y=>200+Math.sin(y/3)*14},{n:'Royal Gold',c:150,s:88,l:52,h:y=>44+Math.sin(y/3)*5},{n:'Rainbow',c:250,s:75,l:58,h:y=>(y*14+210)%360},{n:'Glacier',c:100,s:55,l:78,g:1,h:y=>195+Math.sin(y/4)*10},{n:'Lava',c:180,s:95,l:48,g:1,h:y=>8+Math.abs(Math.sin(y/2))*30},{n:'Neon City',c:220,s:100,l:55,g:1,h:y=>y%2?320:185},{n:'Galaxy',c:300,s:80,l:40,g:1,h:y=>250+Math.sin(y/3)*40},{n:'Candy',c:350,s:85,l:70,h:y=>y%2?335:170}];
const GK={s:95,l:56,g:1,h:()=>46},MT=[.5,.8,.4,1,.55,.9,.45,.75];
const TH=[{n:'Journey',d:'Dawn to space as you climb',c:0},{n:'Desert Dusk',d:'Golden sunset, warm dunes',c:60,p:2,g:['#d9954f','#8a5528']},{n:'Snow Peaks',d:'Calm day with falling snow',c:0,mt:'Reach score 25',ms:()=>best>=25,p:1,snow:1,g:['#f4faff','#b9d3ea']},{n:'Neon Rain',d:'Rainy night with lightning',c:0,mt:'Get a combo of 5',ms:()=>D.s.maxc>=5,p:3,g:['#2a1456','#0a0620']},{n:'Cosmos',d:'Stars and shooting comets',c:0,mt:'Build 100 floors',ms:()=>D.s.maxh>=100,p:4,g:['#1b1446','#0b0824']}];
const ST=[['#ff9a76','#ffe0a8'],['#3fa9f5','#c4ecff'],['#ff6b6b','#ffc27a'],['#1c1450','#6a2c70'],['#03020f','#1b1446']];
const CL=[[40,120,6,1],[250,230,4,.8],[150,380,8,1.2],[300,520,5,.7]],PN=[0,2,4,7,9,12,14,16,19,21];
const B={play:[50,226,260,64],skins:[24,306,100,52],worlds:[130,306,100,52],scores:[236,306,100,52],again:[40,440,280,48],rev:[40,494,280,40],share:[40,540,134,40],menu:[186,540,134,40],resume:[60,196,240,52],restart:[60,258,240,48],pmenu:[60,314,240,48],tsfx:[60,376,114,44],tvib:[186,376,114,44],dn:[60,340,110,44],dy:[190,340,110,44],ach:[70,540,220,40],gift:[50,370,260,42],back:[110,H-90,140,48]};
const inb=(b,lx,ly)=>lx>b[0]&&lx<b[0]+b[2]&&ly>b[1]&&ly<b[1]+b[3];
function hx(h){return[1,3,5].map(i=>parseInt(h.substr(i,2),16))}
function mix(a,b,t){a=hx(a);b=hx(b);return'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join()+')'}
let xgain=0,mode=0,crule=0,lives=3,tl=60,dGoal=25,dcDone=false,gc=0,dlg=null,info=null,fl=0,fever=0,fevc=0,mi=0,lastNote=0,revived=false,pend=false,canRev=false,bonus=0,maxc=0,mnames=[],mgain=0,bn={s:'',t:0},pf=0,gain=0,ps=[],isNew=false,st='start',trans=0,blocks,cur,score,combo,cam,camT,dir,spd,fx,cuts,overAt=0,ac;
function go(s){st=s;trans=1;rdr()}
const MODES=[{n:'Classic',d:'Stack, combo, beat your best'},{n:'Zen',d:'Relax: misses never end the run'},{n:'Time Attack',d:'60 seconds. Perfect +2s, miss -3s'},{n:'Challenge',d:'A random special rule each run'},{n:'Daily Challenge',d:''}],CRN=['Perfect drops only','Narrow blocks','Very fast blocks','Only 3 misses'],CGOAL=[10,25,25,30];
const AC=[['First Build','Finish your first game',()=>D.played>=1],['Perfect Start','3 PERFECT drops in one game',()=>pf>=3],['Combo Master','Reach combo x10',()=>D.s.maxc>=10],['Golden Builder','Place 10 golden blocks',()=>D.s.gold>=10],['High Climber','Reach 50 floors',()=>D.s.maxh>=50],['100 Floors','Reach 100 floors',()=>D.s.maxh>=100],['Daily Player','Reach a 7 day streak',()=>D.streak>=7],['Skin Collector','Own 5 skins',()=>D.unlocked.length>=5],['World Explorer','Own 3 worlds',()=>D.tu.length>=3],['Minar Master','Play 100 games',()=>D.played>=100]];
function lvl(xp){let l=1,n=60;while(xp>=n){xp-=n;l++;n=60+l*25}return[l,xp,n]}
function dayIdx(){return Math.floor(Date.now()/864e5)}
function startMode(i){mode=i;if(i===3)crule=Math.floor(Math.random()*4);if(i===4){crule=dayIdx()%4;dGoal=CGOAL[crule]}start()}
const ui=document.getElementById('ui');
const IC={gear:'<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1112 8.4a3.6 3.6 0 010 7.2z"/></svg>',back:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',lock:'<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M17 9V7a5 5 0 00-10 0v2H5v12h14V9zM9 7a3 3 0 016 0v2H9z"/></svg>'};
const CO='<i class="co"></i>';
const bt=(a,l,c,i)=>'<button class="btn '+c+'" data-a="'+a+'"'+(i!=null?' data-i="'+i+'"':'')+'>'+l+'</button>';
const hd=(t,b)=>'<div class="hd in">'+(b?'<button class="ib" data-a="back">'+IC.back+'</button>':'<span class="sp"></span>')+'<h2>'+t+'</h2><span class="sp"></span></div>';
const cd=h=>'<div class="card in">'+h+'</div>';
const cl=()=>'<div class="pill in" style="align-self:center;width:auto">'+CO+D.coins+'</div>';
const chip=(sel,u,t)=>'<span class="chip '+(sel?'ok':u?'':'pr')+'">'+(sel?'Selected':u?'Use':IC.lock+' '+t)+'</span>';
function toast(s){bn={s:s,t:90}}
function rdr(){let h='',c='dim';const s=st;
 if(s==='start'){c='';const lv=lvl(D.xp);h='<div class="bar in"><div class="pill">'+CO+D.coins+'</div><div class="pill lv"><i style="width:'+Math.max(10,100*lv[1]/lv[2])+'%"></i><b>Lv '+lv[0]+'</b></div><button class="ib" data-a="settings">'+IC.gear+'</button></div><h1 class="in">MINAR</h1><p class="sub in">Perfect Tower</p><div class="in">'+bt('play','PLAY','g big')+'</div><div class="tri in">'+bt('skins','Skins','p')+bt('worlds','Worlds','b')+bt('scores','Scores','o')+'</div>'+(giftOk()?'<div class="in">'+bt('gift','Claim daily gift','o')+'</div>':'')+'<div class="ft">Developed by Umar</div>'}
 else if(s==='modes')h=hd('Choose mode',1)+MODES.map((q,i)=>'<button class="row in" data-a="mode" data-i="'+i+'"><span><b>'+q.n+'</b><small>'+(i===4?'Today: '+CRN[dayIdx()%4]+', reach '+CGOAL[dayIdx()%4]+' floors':q.d)+'</small></span>'+(i===4&&D.dc===today()?'<span class="chip ok">Done</span>':'<span class="chip">'+['3 lives','Endless','60s','Random','Daily'][i]+'</span>')+'</button>').join('');
 else if(s==='skins')h=hd('Skins',1)+cl()+'<div class="grid">'+SK.map((q,i)=>{const u=D.unlocked.includes(i),sel=D.sel===i;return '<button class="tile in'+(sel?' sel':'')+'" data-a="skin" data-i="'+i+'"><div class="pv">'+[0,3,6].map(m=>'<i style="background:hsl('+q.h(m)+','+q.s+'%,'+q.l+'%);'+(q.g?'box-shadow:0 0 10px hsl('+q.h(m)+',100%,60%)':'')+'"></i>').join('')+'</div>'+q.n+chip(sel,u,q.c)+'</button>'}).join('')+'</div>';
 else if(s==='worlds')h=hd('Worlds',1)+cl()+TH.map((q,i)=>{const u=D.tu.includes(i),sel=D.th===i,pi=q.p==null?1:q.p;return '<button class="row in'+(sel?' sel':'')+'" data-a="world" data-i="'+i+'"><span style="display:flex;gap:12px;align-items:center"><i style="width:46px;height:46px;border-radius:12px;background:linear-gradient('+ST[pi][0]+','+ST[pi][1]+')"></i><span><b>'+q.n+'</b><small>'+q.d+'</small></span></span>'+chip(sel,u,q.ms?q.mt:q.c)+'</button>'}).join('');
 else if(s==='scores')h=hd('Scores',1)+cd('<h3>Top 5 (Classic)</h3>'+[0,1,2,3,4].map(r=>'<div class="ln"><span>'+(r+1)+'</span><b>'+(D.top[r]!=null?D.top[r]:'-')+'</b></div>').join(''))+cd('<h3>Today missions</h3>'+M.map((m,i)=>'<div class="ln"><span class="'+(D.m.done[i]?'dn':'')+'">'+(D.m.done[i]?'Done: ':'')+m.t+'</span><b>+'+m.r+'</b></div>').join(''))+'<div class="ln mut in"><span>Games played '+D.played+'</span><span>Best '+best+'</span></div>'+bt('ach','Achievements '+D.ach.length+'/'+AC.length,'p');
 else if(s==='ach')h=hd('Achievements',1)+AC.map((a,i)=>{const d=D.ach.includes(i);return '<div class="row in'+(d?' sel':'')+'"><span><b>'+a[0]+'</b><small>'+a[1]+'</small></span><span class="chip '+(d?'ok':'')+'">'+(d?'Done':IC.lock)+'</span></div>'}).join('');
 else if(s==='settings')h=hd('Settings',1)+'<div class="row in" data-a="sfx"><span>Sound effects</span><i class="sw'+(mute?'':' on')+'"></i></div><div class="row in" data-a="vib"><span>Vibration</span><i class="sw'+(vib?' on':'')+'"></i></div><button class="row in" data-a="info" data-i="0"><span>How to play</span><span>&rsaquo;</span></button><button class="row in" data-a="info" data-i="1"><span>Privacy policy</span><span>&rsaquo;</span></button><button class="row in" data-a="info" data-i="2"><span>Credits</span><span>&rsaquo;</span></button><button class="row danger in" data-a="reset"><span>Reset progress</span><span>!</span></button>';
